name: NFS Heat DevKit

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nfsheat

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build NFS Heat and DevKit
        run: cmake --build --preset clang-x64-debug --target nfsheat devkit mcp_bridge --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_output | Out-Null
          Copy-Item build\Debug\renodx-nfsheat.addon64,build\Debug\renodx-devkit.addon64,build\Debug\renodx-mcp-bridge.exe -Destination build_output -ErrorAction Stop

      - name: Upload DevKit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renodx-nfsheat-devkit
          path: build_output/
