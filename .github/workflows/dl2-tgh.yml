name: DL2 TGH

on:
  workflow_dispatch:
  push:
    branches: [DL2-TGH]

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build DL2 TGH (x64)
        run: cmake --build --preset clang-x64-release --target dyinglight2 --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_output | Out-Null
          Copy-Item build\release\renodx-dyinglight2.addon64 -Destination build_output -ErrorAction Stop

      - name: Upload DL2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: renodx-dl2-tgh
          path: build_output/
