name: Clang x64

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**", "f122"]
    paths:
      - "src/games/f122/**"
      - "src/mods/**"
      - "src/shaders/**"
      - "src/utils/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/clang-x64.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build (x64)
        run: cmake --build --preset clang-x64-release --target f122 devkit mcp_bridge --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Create output directory
        run: md build_output

      - name: Copy addon binaries
        run: copy build\release\*.addon64 build_output\

      - name: Copy tool binaries
        run: copy build\release\*.exe build_output\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renodx-f122
          path: build_output/

