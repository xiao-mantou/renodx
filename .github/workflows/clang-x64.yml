name: Clang x64

on:
  workflow_dispatch:
  push:
    branches: [main, dyinglight2-fix, "test-*", "codex/**"]
    paths:
      - "src/games/dyinglight2/**"
      - "src/mods/**"
      - "src/shaders/**"
      - "src/utils/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/clang-x64.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Download Slang binaries
        run: |
          curl -L -o slang.zip https://github.com/shader-slang/slang/releases/download/v2025.10.3/slang-2025.10.3-windows-x86_64.zip
          powershell -Command "Expand-Archive -Path slang.zip -DestinationPath slang_temp -Force; if (!(Test-Path -Path .\bin)) { New-Item -ItemType Directory -Path .\bin }; Copy-Item slang_temp\bin\* .\bin -Force; Remove-Item slang_temp -Recurse -Force"

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set build revision
        id: build_revision
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_OUTPUT -Value "short=$($env:GITHUB_SHA.Substring(0, 7))"

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DRENODX_BUILD_VERSION=${{ steps.build_revision.outputs.short }}

      - name: Build (x64)
        run: cmake --build --preset clang-x64-release --target dyinglight2 --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Create output directory
        run: md build_output

      - name: Copy addon binaries
        run: copy build\release\*.addon64 build_output\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renodx-dyinglight2
          path: build_output/

