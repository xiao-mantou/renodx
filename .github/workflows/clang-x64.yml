name: Clang x64

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**", "f122"]
    paths:
      - "src/games/f122/**"
      - "src/mods/**"
      - "src/shaders/**"
      - "src/utils/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/clang-x64.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        run: |
          curl.exe -sSL --retry 3 -o dxc.zip https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip
          Expand-Archive -Path dxc.zip -DestinationPath dxc_temp -Force
          New-Item -ItemType Directory -Force -Path .\bin | Out-Null
          Copy-Item dxc_temp\bin\x64\dxc.exe,dxc_temp\bin\x64\dxcompiler.dll,dxc_temp\bin\x64\dxil.dll .\bin -Force
          Remove-Item dxc_temp -Recurse -Force
          curl.exe -sSL --retry 3 -o slang.zip https://github.com/shader-slang/slang/releases/download/v2025.10.3/slang-2025.10.3-windows-x86_64.zip
          Expand-Archive -Path slang.zip -DestinationPath slang_temp -Force
          Copy-Item slang_temp\bin\* .\bin -Force
          Remove-Item slang_temp -Recurse -Force

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build (x64)
        run: cmake --build --preset clang-x64-release --target f122 --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Create output directory
        run: md build_output

      - name: Copy addon binaries
        run: copy build\release\*.addon64 build_output\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renodx-f122
          path: build_output/

