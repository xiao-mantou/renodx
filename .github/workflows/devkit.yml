name: DevKit MCP

on:
  workflow_dispatch:
  push:
    branches: [main, dyinglight2-fix, "test-*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Download Slang binaries
        run: |
          curl -L -o slang.zip https://github.com/shader-slang/slang/releases/download/v2025.10.3/slang-2025.10.3-windows-x86_64.zip
          powershell -Command "Expand-Archive -Path slang.zip -DestinationPath slang_temp -Force; if (!(Test-Path -Path .\bin)) { New-Item -ItemType Directory -Path .\bin }; Copy-Item slang_temp\bin\* .\bin -Force; Remove-Item slang_temp -Recurse -Force"

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build devkit + mcp_bridge (debug)
        run: cmake --build --preset clang-x64-debug --target devkit mcp_bridge --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Create output directory
        run: md build_output

      - name: Copy devkit binaries
        run: |
          copy build\Debug\renodx-devkit.addon64 build_output\ 2>nul
          copy build\Debug\renodx-mcp-bridge.exe build_output\ 2>nul
          if exist bin\cmd_Decompiler.exe copy bin\cmd_Decompiler.exe build_output\
          if exist bin\slangc.exe copy bin\slangc.exe build_output\
          if exist bin\dxc.exe copy bin\dxc.exe build_output\
          if exist bin\dxcompiler.dll copy bin\dxcompiler.dll build_output\
          if exist bin\fxc.exe copy bin\fxc.exe build_output\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renodx-devkit-mcp
          path: build_output/
