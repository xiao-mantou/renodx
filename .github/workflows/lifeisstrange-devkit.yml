name: Life Is Strange addon x86

on:
  workflow_dispatch:
  push:
    branches:
      - codex/life-is-strange
    paths:
      - "src/games/lifeisstrange/**"
      - "src/addons/devkit/**"
      - "src/apps/mcp_bridge/**"
      - "src/mods/**"
      - "src/shaders/**"
      - "src/utils/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "scripts/setup-dev-env.ps1"
      - ".github/workflows/lifeisstrange-devkit.yml"

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x86

      - name: Configure build for x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configure CMake (x86)
        run: cmake --preset clang-x86 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DRENODX_BUILD_VERSION=lifeisstrange-${{ github.sha }}

      - name: Build Life Is Strange addon
        run: cmake --build --preset clang-x86-debug --target lifeisstrange --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Collect x86 artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_output | Out-Null
          Copy-Item build32\Debug\renodx-lifeisstrange.addon32 -Destination build_output -ErrorAction Stop

      - name: Upload x86 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renodx-lifeisstrange-x86
          path: build_output/
